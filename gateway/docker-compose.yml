services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MTX_PATHS_INTELBRAS_SOURCE: ${CAMERA_RTSP_URL}
      MTX_PATHS_INTELBRAS_SOURCEONDEMAND: "yes"
      MTX_HLS: "yes"
      MTX_HLSADDRESS: ":8888"
      MTX_HLSVARIANT: "lowLatency"
      # Mantém o HLS pronto e reduz o tempo de espera no primeiro frame.
      MTX_HLSALWAYSREMUX: "yes"
      # Playlist curta evita acumular histórico; a latência é controlada pelo player.
      # Low-Latency HLS exige pelo menos 7 segmentos no MediaMTX.
      MTX_HLSSEGMENTCOUNT: "7"
      MTX_HLSSEGMENTDURATION: "1s"
      MTX_HLSPARTDURATION: "100ms"
      MTX_HLSALLOWORIGINS: ${APP_ORIGIN}
      MTX_WEBRTC: "no"
      MTX_AUTHMETHOD: "internal"
      MTX_AUTHINTERNALUSERS_0_USER: ${STREAM_USER_1}
      MTX_AUTHINTERNALUSERS_0_PASS: ${STREAM_PASS_1}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: "read"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: "intelbras"
      MTX_AUTHINTERNALUSERS_1_USER: ${STREAM_USER_2}
      MTX_AUTHINTERNALUSERS_1_PASS: ${STREAM_PASS_2}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: "read"
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: "intelbras"
    networks:
      - camera_gateway

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mediamtx
    ports:
      - "80:80"
      - "443:443"
    environment:
      STREAM_DOMAIN: ${STREAM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - camera_gateway

networks:
  camera_gateway:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
